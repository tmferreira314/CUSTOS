<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carteira — Gastos e Ganhos</title>
  <meta name="description" content="Regista os teus gastos e ganhos pessoais. Funciona 100% offline, sem contas.">

  <!-- iPhone: fica como app no ecrã principal -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Carteira">
  <meta name="format-detection" content="telephone=no">

  <!-- Cor da barra de estado (claro/escuro) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">

  <!-- Caminhos relativos: funciona em subcaminho do GitHub Pages -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript><p class="vazio" data-i18n="precisa_js">Esta app precisa de JavaScript activo.</p></noscript>

  <!-- Cabeçalho -->
  <header class="topo">
    <h1 id="titulo-aba">Resumo</h1>
    <button type="button" class="btn-icone" id="btn-definicoes" aria-label="Definições" data-i18n-aria="titulo_definicoes">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h9"/><path d="M19 8h1"/><circle cx="16" cy="8" r="2.5"/>
        <path d="M4 16h3"/><path d="M13 16h7"/><circle cx="10" cy="16" r="2.5"/>
      </svg>
    </button>
  </header>

  <main class="conteudo">
    <!-- ===== ABA RESUMO (início) ===== -->
    <section id="aba-resumo" class="aba ativa" aria-label="Resumo">
      <div id="stats-resumo" class="cartoes"></div>
    </section>

    <!-- ===== ABA GASTOS ===== -->
    <section id="aba-gastos" class="aba" aria-label="Gastos">
      <button type="button" class="btn-grande vermelho" id="btn-add-gasto">＋ Adicionar gasto</button>
      <div class="filtros" id="filtros-gastos"></div>
      <div id="stats-gastos" class="cartoes"></div>
    </section>

    <!-- ===== ABA GANHOS ===== -->
    <section id="aba-ganhos" class="aba" aria-label="Ganhos">
      <button type="button" class="btn-grande verde" id="btn-add-ganho">＋ Adicionar ganho</button>
      <div class="filtros" id="filtros-ganhos"></div>
      <div id="stats-ganhos" class="cartoes"></div>
    </section>

    <!-- ===== ABA BALANÇO ===== -->
    <section id="aba-balanco" class="aba" aria-label="Balanço">
      <div class="filtros" id="filtros-balanco"></div>
      <div id="stats-balanco" class="cartoes"></div>
    </section>

    <!-- ===== ABA HISTÓRICO ===== -->
    <section id="aba-historico" class="aba" aria-label="Histórico">
      <div class="filtros-hist-barra">
        <div class="chips" id="filtro-historico"></div>
        <span class="filtros-hist-btn">
          <button type="button" class="btn-mini azul" id="btn-filtros-hist"
                  data-i18n-aria="filtros" aria-label="Filtros" data-i18n="filtros">Filtros</button>
          <span class="badge" id="badge-filtros" hidden></span>
        </span>
      </div>
      <div id="lista-historico"></div>
    </section>
  </main>

  <!-- ===== Barra de abas ===== -->
  <nav class="abas" aria-label="Navegação principal">
    <button type="button" class="tab-btn ativa" data-aba="resumo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/></svg>
      <span data-i18n="resumo">Resumo</span>
    </button>
    <button type="button" class="tab-btn" data-aba="gastos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14"/><path d="m6 13 6 6 6-6"/></svg>
      <span data-i18n="gastos">Gastos</span>
    </button>
    <button type="button" class="tab-btn" data-aba="ganhos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6"/><path d="m6 11 6-6 6 6"/></svg>
      <span data-i18n="ganhos">Ganhos</span>
    </button>
    <button type="button" class="tab-btn" data-aba="balanco">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><rect x="5" y="11" width="4" height="7"/><rect x="11" y="6" width="4" height="12"/><rect x="17" y="14" width="4" height="4"/></svg>
      <span data-i18n="balanco">Balanço</span>
    </button>
    <button type="button" class="tab-btn" data-aba="historico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>
      <span data-i18n="historico">Histórico</span>
    </button>
  </nav>

  <!-- ===== Modal de movimento (adicionar/editar) ===== -->
  <div class="fundo" id="modal-fundo" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="folha-cabecalho">
        <h2 id="modal-titulo" data-i18n="add_gasto">Adicionar gasto</h2>
        <span class="cab-acoes">
          <button type="button" class="btn-icone" id="btn-duplicar-mov" hidden
                  aria-label="Duplicar" data-i18n-aria="duplicar" title="Duplicar">⧉</button>
          <button type="button" class="btn-icone" id="btn-fechar-modal" aria-label="Fechar" data-i18n-aria="fechar">✕</button>
        </span>
      </div>

      <form id="form-mov" novalidate>
        <div class="campo">
          <div class="rot-linha">
            <span id="rot-valor" data-i18n="valor_gasto">Valor gasto (€)</span>
            <button type="button" class="btn-mini" id="btn-repetir-ultimo" hidden
                    data-i18n="repetir_ultimo">Repetir último</button>
          </div>
          <input id="f-valor" class="controlo" type="text" inputmode="decimal" autocomplete="off"
                 aria-labelledby="rot-valor"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 enterkeyhint="done" placeholder="0,00">
        </div>

        <!-- Tipo de gasto (chips) -->
        <div class="campo" id="campo-categoria">
          <span id="rot-cat" data-i18n="tipo_gasto">Tipo de gasto</span>
          <div class="chips" id="chips-categoria"></div>
        </div>

        <!-- Origem do ganho (selecção) -->
        <div class="campo" id="campo-origem" hidden>
          <label for="f-origem"><span id="rot-orig" data-i18n="origem_ganho">Origem do ganho</span></label>
          <select id="f-origem" class="controlo"></select>
          <input id="f-origem-texto" class="controlo" type="text" placeholder="Escreve a origem"
                 data-i18n-ph="escreve_origem" autocomplete="off" hidden>
        </div>

        <label class="campo">
          <span data-i18n="data">Data</span>
          <input id="f-data" type="date" class="controlo">
        </label>

        <label class="campo">
          <span data-i18n="explicacao">Explicação (opcional)</span>
          <input id="f-nota" type="text" class="controlo" maxlength="140" placeholder="Ex.: almoço com amigos"
                 data-i18n-ph="exemplo_nota">
        </label>

        <p class="erro" id="erro-form" hidden></p>

        <div class="acoes-folha">
          <button type="button" class="btn-secundario perigo" id="btn-apagar-mov" hidden data-i18n="apagar">Apagar</button>
          <button type="submit" class="btn-grande verde" id="btn-guardar-mov" data-i18n="guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Folha de definições ===== -->
  <div class="fundo" id="def-fundo" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="def-titulo">
      <div class="folha-cabecalho">
        <h2 id="def-titulo" data-i18n="titulo_definicoes">Definições</h2>
        <button type="button" class="btn-icone" id="btn-fechar-def" aria-label="Fechar" data-i18n-aria="fechar">✕</button>
      </div>
      <div id="def-conteudo"></div>
    </div>
  </div>

  <!-- ===== Folha de detalhe de um tipo (clicar num gráfico) ===== -->
  <div class="fundo" id="detalhe-fundo" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="detalhe-titulo">
      <div class="folha-cabecalho">
        <h2 id="detalhe-titulo">Detalhe</h2>
        <button type="button" class="btn-icone" id="btn-fechar-detalhe" aria-label="Fechar" data-i18n-aria="fechar">✕</button>
      </div>
      <div id="detalhe-conteudo"></div>
    </div>
  </div>

  <!-- ===== Folha de filtros do Histórico ===== -->
  <div class="fundo" id="filtros-fundo" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="filtros-titulo">
      <div class="folha-cabecalho">
        <h2 id="filtros-titulo" data-i18n="filtros">Filtros</h2>
        <button type="button" class="btn-icone" id="btn-fechar-filtros" aria-label="Fechar"
                data-i18n-aria="fechar">✕</button>
      </div>
      <div id="filtros-conteudo"></div>
    </div>
  </div>

  <!-- Aviso temporário (toast) -->
  <div id="aviso" class="aviso" hidden></div>

  <!-- Relatório para impressão / PDF (invisível no ecrã) -->
  <div id="impressao" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
